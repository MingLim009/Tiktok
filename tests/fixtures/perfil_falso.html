<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Perfil falso — pruebas del bot de Live</title>
<!--
  Imita el perfil de un usuario de TikTok para ejercitar abrir_chat_con(),
  que es como el bot de Live le escribe a quien comentó en la transmisión.

  Con ?sinboton=1 simula a alguien que tiene los mensajes cerrados a
  desconocidos: un caso normal que el bot debe saltear sin romperse.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; }
  header { padding: 24px; border-bottom: 1px solid #eee; display: flex; gap: 16px; }
  .avatar { width: 88px; height: 88px; border-radius: 50%; background: #ddd; }
  .acciones { display: flex; gap: 8px; margin-top: 10px; }
  button {
    border: 1px solid #ddd; background: #fff; border-radius: 4px;
    padding: 8px 18px; cursor: pointer; font-size: 15px;
  }
  #chat { display: none; padding: 16px; }
  #burbujas { display: flex; flex-direction: column; gap: 8px; min-height: 180px; }
  .burbuja { max-width: 62%; padding: 9px 13px; border-radius: 14px; }
  .entrante { align-self: flex-start; background: #f1f1f2; }
  .propia   { align-self: flex-end;   background: #fe2c55; color: #fff; }
  #barra { display: flex; gap: 8px; margin-top: 12px; }
  #caja { flex: 1; border: 1px solid #ddd; border-radius: 18px; padding: 9px 14px; }
</style>
</head>
<body>

<header>
  <div class="avatar"></div>
  <div>
    <h2 id="usuario">@usuario</h2>
    <div class="acciones">
      <button data-e2e="follow-button">Seguir</button>
      <button id="btn-mensaje" data-e2e="message-button">Mensaje</button>
    </div>
  </div>
</header>

<div id="chat">
  <div id="burbujas"></div>
  <div id="barra">
    <div id="caja" data-e2e="message-input-area" contenteditable="true" role="textbox"></div>
    <button id="enviar" data-e2e="message-send" type="submit">Enviar</button>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
document.getElementById("usuario").textContent =
  "@" + (params.get("u") || "espectador");

// Perfil con mensajes cerrados: no hay botón para escribirle.
if (params.get("sinboton") === "1") {
  document.getElementById("btn-mensaje").remove();
}

const mensajes = [];

function pintar() {
  document.getElementById("burbujas").innerHTML = mensajes.map(m => `
    <div class="burbuja ${m.entrante ? "entrante" : "propia"}" data-e2e="chat-item">
      ${m.texto}
    </div>`).join("");
}

document.getElementById("btn-mensaje")?.addEventListener("click", () => {
  document.getElementById("chat").style.display = "block";
});

function enviarMensaje() {
  const caja = document.getElementById("caja");
  const texto = caja.innerText.trim();
  if (!texto) return;
  mensajes.push({ texto, entrante: false });
  caja.innerText = "";
  pintar();
}

document.getElementById("enviar").addEventListener("click", enviarMensaje);
document.getElementById("caja").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviarMensaje(); }
});
</script>
</body>
</html>
