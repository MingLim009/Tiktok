<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bandeja falsa — pruebas del bot</title>
<!--
  Imita la estructura de la bandeja de TikTok lo suficiente para ejercitar
  src/ragnar_agent/tiktok/dm.py sin necesitar una cuenta real.

  No reemplaza la validación contra tiktok.com: los selectores reales pueden
  ser otros. Lo que SÍ valida es la lógica que va después de encontrarlos —
  detección de no leídos, de quién es cada burbuja, y el flujo de envío —
  que es donde un bug pasaría inadvertido hasta estar en vivo.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; }
  #lista { width: 340px; border-right: 1px solid #ddd; overflow-y: auto; }
  .chat-item-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid #f0f0f0; cursor: pointer;
  }
  .chat-item-row:hover { background: #fafafa; }
  .meta { flex: 1; min-width: 0; }
  .badge {
    background: #fe2c55; color: #fff; border-radius: 10px;
    padding: 1px 7px; font-size: 11px;
  }
  #panel { flex: 1; display: flex; flex-direction: column; }
  #burbujas { flex: 1; padding: 16px; overflow-y: auto;
              display: flex; flex-direction: column; gap: 8px; }
  .burbuja { max-width: 62%; padding: 9px 13px; border-radius: 14px; }
  .entrante { align-self: flex-start; background: #f1f1f2; }
  .propia   { align-self: flex-end;   background: #fe2c55; color: #fff; }
  #barra { border-top: 1px solid #ddd; padding: 10px; display: flex; gap: 8px; }
  #caja { flex: 1; border: 1px solid #ddd; border-radius: 18px;
          padding: 9px 14px; min-height: 38px; }
  #enviar { border: 0; background: #fe2c55; color: #fff;
            border-radius: 18px; padding: 0 18px; cursor: pointer; }
</style>
</head>
<body>

<div id="lista"></div>

<div id="panel">
  <div id="burbujas"></div>
  <div id="barra">
    <div id="caja" data-e2e="message-input-area" contenteditable="true" role="textbox"></div>
    <button id="enviar" data-e2e="message-send" type="submit">Enviar</button>
  </div>
</div>

<script>
// Estado de la bandeja falsa. Cada conversación termina en un mensaje del
// cliente (hay que responder) o en uno nuestro (ya respondimos).
const CONVERSACIONES = [
  {
    usuario: "maria_lp", noLeido: true,
    mensajes: [
      { texto: "hola! a cuanto esta el cambio?", entrante: true },
      { texto: "Hola! Depende del monto. ¿Cuánto querías cambiar?", entrante: false },
      { texto: "5000 bolivianos a soles", entrante: true },
    ],
  },
  {
    usuario: "jorge.andia", noLeido: true,
    mensajes: [
      { texto: "buenas, hacen swift?", entrante: true },
    ],
  },
  {
    // Ya respondida: el bot NO debe volver a escribir aquí.
    usuario: "cliente_atendido", noLeido: false,
    mensajes: [
      { texto: "gracias!", entrante: true },
      { texto: "¡A ti! Cualquier cosa me escribes 🙌", entrante: false },
    ],
  },
];

let abierta = 0;

function pintarLista() {
  document.getElementById("lista").innerHTML = CONVERSACIONES.map((c, i) => `
    <div class="chat-item-row" data-e2e="chat-list-item" data-i="${i}">
      <div class="meta">
        <p data-e2e="chat-list-nickname">${c.usuario}</p>
        <p data-e2e="chat-list-msg">${c.mensajes[c.mensajes.length - 1].texto}</p>
      </div>
      ${c.noLeido ? '<span class="badge" data-e2e="chat-list-unread">1</span>' : ""}
    </div>`).join("");

  document.querySelectorAll("[data-e2e='chat-list-item']").forEach(el => {
    el.addEventListener("click", () => {
      abierta = Number(el.dataset.i);
      CONVERSACIONES[abierta].noLeido = false;
      pintarLista();
      pintarChat();
    });
  });
}

function pintarChat() {
  document.getElementById("burbujas").innerHTML =
    CONVERSACIONES[abierta].mensajes.map(m => `
      <div class="burbuja ${m.entrante ? "entrante" : "propia"}" data-e2e="chat-item">
        ${m.texto}
      </div>`).join("");
}

// Enviar: agrega la burbuja propia, igual que haría TikTok.
function enviarMensaje() {
  const caja = document.getElementById("caja");
  const texto = caja.innerText.trim();
  if (!texto) return;
  CONVERSACIONES[abierta].mensajes.push({ texto, entrante: false });
  caja.innerText = "";
  pintarLista();
  pintarChat();
}

document.getElementById("enviar").addEventListener("click", enviarMensaje);
document.getElementById("caja").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviarMensaje(); }
});

pintarLista();
pintarChat();
</script>
</body>
</html>
