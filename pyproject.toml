[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragnar-agent"
version = "0.1.0"
description = "Agente de IA para atencion al cliente en TikTok (DMs + Live) - Ragnar Capital"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
